<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --dark:  #080f0a;
  --green: #0d4a28;
  --lime:  #b5e853;
  --lime2: #d4f57a;
  --cream: #f0ead8;
  --glow:  rgba(181,232,83,0.35);
}

html, body {
  width: 100%; height: 100%;
  background: var(--dark);
  /* overflow:hidden removed — required for AdSense crawler visibility */
  cursor: none;
}

/* ── CUSTOM CURSOR ────────────────────────── */
.cursor {
  position: fixed;
  width: 10px; height: 10px;
  background: var(--lime);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.1s, width 0.2s, height 0.2s, opacity 0.2s;
  mix-blend-mode: difference;
}

.cursor-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(181,232,83,0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  transition: transform 0.18s ease, width 0.3s, height 0.3s, opacity 0.3s;
}

/* ── CANVAS LAYER ─────────────────────────── */
#bg-canvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 0;
}

/* ── NOISE OVERLAY ────────────────────────── */
.noise {
  position: fixed;
  inset: 0;
  z-index: 1;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 200px;
  pointer-events: none;
}

/* ── RADIAL GLOW ──────────────────────────── */
.glow-center {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(26,122,74,0.18) 0%, rgba(13,74,40,0.08) 40%, transparent 70%);
  border-radius: 50%;
  z-index: 2;
  pointer-events: none;
  animation: glowBreath 4s ease-in-out infinite;
}

@keyframes glowBreath {
  0%,100% { transform: translate(-50%,-50%) scale(1); opacity:0.8; }
  50%      { transform: translate(-50%,-50%) scale(1.15); opacity:1; }
}

/* ── RING ANIMATIONS ──────────────────────── */
.rings {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  pointer-events: none;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(181,232,83,0.07);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: ringExpand linear infinite;
}

.ring:nth-child(1) { width: 200px;  height: 200px;  animation-duration: 6s;  animation-delay: 0s; }
.ring:nth-child(2) { width: 340px;  height: 340px;  animation-duration: 8s;  animation-delay: 1s; }
.ring:nth-child(3) { width: 500px;  height: 500px;  animation-duration: 10s; animation-delay: 2s; }
.ring:nth-child(4) { width: 680px;  height: 680px;  animation-duration: 12s; animation-delay: 3s; }
.ring:nth-child(5) { width: 880px;  height: 880px;  animation-duration: 14s; animation-delay: 1.5s; }
.ring:nth-child(6) { width: 1100px; height: 1100px; animation-duration: 16s; animation-delay: 0.5s; }

@keyframes ringExpand {
  0%   { opacity: 0;    transform: translate(-50%,-50%) scale(0.92); }
  20%  { opacity: 0.6; }
  80%  { opacity: 0.15; }
  100% { opacity: 0;    transform: translate(-50%,-50%) scale(1.04); }
}

/* ── PARTICLES ────────────────────────────── */
.particles {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: var(--lime);
  animation: particleDrift linear infinite;
  opacity: 0;
}

@keyframes particleDrift {
  0%   { opacity: 0;    transform: translateY(0) scale(0); }
  10%  { opacity: 0.8; transform: translateY(-10px) scale(1); }
  90%  { opacity: 0.4; }
  100% { opacity: 0;   transform: translateY(-120px) scale(0.2); }
}

/* ── SCANLINES ────────────────────────────── */
.scanlines {
  position: fixed;
  inset: 0;
  z-index: 4;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.03) 3px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
}

/* ── MAIN WRAPPER ─────────────────────────── */
.splash {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

/* ── LOGO MARK ────────────────────────────── */
.logo-mark {
  position: relative;
  width: 96px; height: 96px;
  margin-bottom: 36px;
  animation: logoIn 0.9s cubic-bezier(0.175,0.885,0.32,1.275) 0.3s both;
}

@keyframes logoIn {
  from { transform: scale(0.4) rotate(-20deg); opacity:0; }
  to   { transform: scale(1) rotate(0deg); opacity:1; }
}

.logo-circle {
  width: 96px; height: 96px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 0 0 var(--glow);
  animation: logoPulse 3s ease-in-out 1.5s infinite;
}

@keyframes logoPulse {
  0%,100% { box-shadow: 0 0 0 0 var(--glow), 0 0 40px rgba(181,232,83,0.2); }
  50%     { box-shadow: 0 0 0 24px transparent, 0 0 80px rgba(181,232,83,0.35); }
}

.logo-orbit {
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  border: 1.5px dashed rgba(181,232,83,0.3);
  animation: orbitSpin 12s linear infinite;
}

@keyframes orbitSpin { to { transform: rotate(360deg); } }

.orbit-dot {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--lime);
  border-radius: 50%;
  top: -4px; left: calc(50% - 4px);
  box-shadow: 0 0 10px var(--lime);
}

/* ── WORDMARK ─────────────────────────────── */
.wordmark {
  text-align: center;
  margin-bottom: 16px;
  overflow: hidden;
}

.wordmark-renew {
  font-family: 'Playfair Display', serif;
  font-size: clamp(48px, 10vw, 88px);
  font-weight: 900;
  color: var(--cream);
  letter-spacing: -3px;
  line-height: 0.9;
  display: block;
  animation: wordSlideIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.7s both;
}

.wordmark-onomics {
  font-family: 'Playfair Display', serif;
  font-size: clamp(48px, 10vw, 88px);
  font-weight: 900;
  font-style: italic;
  color: var(--lime);
  letter-spacing: -3px;
  line-height: 0.9;
  display: block;
  animation: wordSlideIn 0.8s cubic-bezier(0.22,1,0.36,1) 0.9s both;
  text-shadow: 0 0 60px rgba(181,232,83,0.4);
}

@keyframes wordSlideIn {
  from { transform: translateY(60px); opacity:0; }
  to   { transform: translateY(0);    opacity:1; }
}

/* ── TAGLINE ──────────────────────────────── */
.tagline {
  font-family: 'Space Mono', monospace;
  font-size: clamp(9px, 1.8vw, 12px);
  text-transform: uppercase;
  letter-spacing: 5px;
  color: rgba(181,232,83,0.55);
  margin-bottom: 52px;
  text-align: center;
  text-indent: 5px;          /* offset the trailing letter-spacing so text sits truly centered */
  max-width: 90%;
  animation: fadeUp 0.8s ease 1.2s both;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── LOADING BAR ──────────────────────────── */
.loader-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  animation: fadeUp 0.6s ease 1.4s both;
}

.loader-track {
  width: clamp(220px, 40vw, 320px);
  height: 2px;
  background: rgba(181,232,83,0.1);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.loader-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--green), var(--lime), var(--lime2));
  border-radius: 2px;
  transition: width 0.12s ease;
  box-shadow: 0 0 12px rgba(181,232,83,0.6);
}

.loader-shimmer {
  position: absolute;
  top: 0; left: 0;
  width: 60px; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 1.2s ease infinite;
}

@keyframes shimmer {
  0%   { left: -60px; }
  100% { left: 100%; }
}

.loader-text {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: rgba(181,232,83,0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
  min-height: 16px;
  transition: opacity 0.3s;
}

.loader-pct {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: rgba(181,232,83,0.6);
  letter-spacing: 1px;
}

/* ── STAT BADGES ──────────────────────────── */
.stat-badges {
  display: flex;
  gap: 12px;
  margin-top: 48px;
  width: 100%;
  max-width: 420px;     /* cap on wider screens so badges don't sprawl */
  animation: fadeUp 0.8s ease 1.6s both;
}

.stat-badge {
  flex: 1 1 0;          /* equal-width columns; will shrink to fit any viewport */
  min-width: 0;         /* prevents flex children from blowing out container */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 14px 12px;   /* tighter horizontal padding for narrow phones */
  background: rgba(181,232,83,0.04);
  border: 1px solid rgba(181,232,83,0.1);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  transition: border-color 0.3s, background 0.3s;
  animation: statCount 0.6s ease both;
}

.stat-badge .stat-val {
  /* Numbers stay legible; CSS clamp scales between mobile and desktop */
  font-size: clamp(18px, 6vw, 28px);
}
.stat-badge .stat-lbl {
  /* Labels are tiny mono caps — keep readable but compact */
  font-size: 10px;
  text-align: center;
  line-height: 1.2;
}

.stat-badge:nth-child(1) { animation-delay: 1.8s; }
.stat-badge:nth-child(2) { animation-delay: 2.0s; }
.stat-badge:nth-child(3) { animation-delay: 2.2s; }

@keyframes statCount {
  from { opacity:0; transform:translateY(20px) scale(0.9); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

.stat-val {
  font-family: 'Space Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: var(--lime);
  line-height: 1;
}

.stat-lbl {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  color: rgba(240,234,216,0.4);
  white-space: nowrap;
}

/* ── CORNER DECO ──────────────────────────── */
.corner {
  position: fixed;
  z-index: 11;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  color: rgba(181,232,83,0.2);
  text-transform: uppercase;
  letter-spacing: 2px;
  animation: fadeUp 1s ease 2s both;
}

.corner-tl { top: 24px; left: 28px; }
.corner-tr { top: 24px; right: 28px; text-align: right; }
.corner-bl { bottom: 24px; left: 28px; }
.corner-br { bottom: 24px; right: 28px; text-align: right; }

/* ── FLASH OUT ────────────────────────────── */
.flash-out {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: var(--lime);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}

/* ── DONE OVERLAY ─────────────────────────── */
.done-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: var(--dark);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.enter-btn {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--dark);
  background: var(--lime);
  border: none;
  padding: 18px 48px;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 40px rgba(181,232,83,0.4);
}

.enter-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 60px rgba(181,232,83,0.6);
}

/* ── FLOATING ICONS ───────────────────────── */
.float-icon {
  position: fixed;
  font-size: clamp(14px, 2.5vw, 22px);
  z-index: 5;
  animation: floatIcon linear infinite;
  opacity: 0;
  pointer-events: none;
  filter: blur(0px);
}

@keyframes floatIcon {
  0%   { opacity:0;   transform: translateY(0) rotate(0deg) scale(0.8); }
  10%  { opacity:0.35; }
  90%  { opacity:0.15; }
  100% { opacity:0;   transform: translateY(-80px) rotate(20deg) scale(1.1); }
}

/* ── HORIZONTAL LINES ─────────────────────── */
.h-line {
  position: fixed;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(181,232,83,0.08), transparent);
  z-index: 3;
  pointer-events: none;
}
</style>
</head>
<body>

  <!-- Logo mark -->

<script>
// ── CURSOR ──────────────────────────────────────────
const cursor     = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px';
  cursor.style.top  = my + 'px';
});

(function animRing() {
  rx += (mx - rx) * 0.12;
  ry += (my - ry) *.12;
  cursorRing.style.left = rx + 'px';
  cursorRing.style.top  = ry + 'px';
  requestAnimationFrame(animRing);
})();

// ── CANVAS BACKGROUND ───────────────────────────────
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Animated mesh gradient
let t = 0;
function drawBg() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Base
  ctx.fillStyle = '#080f0a';
  ctx.fillRect(0, 0, W, H);

  // Animated blobs
  const blobs = [
    { x: W*0.2 + Math.sin(t*0.3)*80,  y: H*0.3 + Math.cos(t*0.2)*60,  r:300, c:'rgba(13,74,40,0.22)' },
    { x: W*0.8 + Math.cos(t*0.25)*60, y: H*0.6 + Math.sin(t*0.35)*80, r:260, c:'rgba(26,122,74,0.14)' },
    { x: W*0.5 + Math.sin(t*0.15)*40, y: H*0.8 + Math.cos(t*0.18)*50, r:220, c:'rgba(181,232,83,0.06)' },
    { x: W*0.1 + Math.cos(t*0.22)*50, y: H*0.7 + Math.sin(t*0.28)*70, r:180, c:'rgba(13,74,40,0.12)' },
  ];

  blobs.forEach(b => {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, b.c);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  });

  // Subtle grid lines
  ctx.strokeStyle = 'rgba(181,232,83,0.025)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  t += 0.008;
  requestAnimationFrame(drawBg);
}
drawBg();

// ── PARTICLES ───────────────────────────────────────
function spawnParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 1.5;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      bottom:${Math.random()*40}%;
      animation-duration:${4+Math.random()*8}s;
      animation-delay:${Math.random()*8}s;
      opacity:${Math.random()*0.7+0.2};
    `;
    container.appendChild(p);
  }
}
spawnParticles();

// ── COUNTER ANIMATION ───────────────────────────────
function animCount(el, target, suffix, duration) {
  if (!el) return;
  // Format the target number nicely:
  //   < 10,000   → plain locale string ("47", "1,234")
  //   ≥ 10,000   → compact with M/K suffix ("11.2M", "47K")
  // The animation steps through plain numbers and re-formats at completion.
  let start = 0;
  const step = target / (duration / 16);
  const fmt = (n) => {
    if (target >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (target >= 10_000)    return Math.floor(n / 1000) + 'K';
    return Math.floor(n).toLocaleString();
  };
  const timer = setInterval(() => {
    start = Math.min(start + step, target);
    el.textContent = fmt(start) + (suffix || '');
    if (start >= target) {
      el.textContent = fmt(target) + (suffix || '');
      clearInterval(timer);
    }
  }, 16);
}

// ── REAL SPLASH STATS ────────────────────────────────
// Fetches the same numbers shown elsewhere on the site so the splash is
// consistent with /feed and /impact. We fetch on demand (when the loader
// hits 100%) rather than racing the loader animation — this guarantees the
// numbers match what API actually has at the moment of display.
async function fetchSplashStats() {
  const API = '/.netlify/functions/api';
  try {
    const [articlesR, catsR, statsR] = await Promise.allSettled([
      fetch(API + '/articles',   { cache: 'no-store' }).then(r => r.ok ? r.json() : []),
      fetch(API + '/categories', { cache: 'no-store' }).then(r => r.ok ? r.json() : []),
      fetch(API + '/stats',      { cache: 'no-store' }).then(r => r.ok ? r.json() : null),
    ]);
    const articles   = articlesR.status === 'fulfilled' && Array.isArray(articlesR.value) ? articlesR.value : [];
    const categories = catsR.status     === 'fulfilled' && Array.isArray(catsR.value)     ? catsR.value     : [];
    const stats      = statsR.status    === 'fulfilled' ? statsR.value : null;

    // "Energy Sources" = physical clean-energy generation categories the site
    // covers (solar, wind, nuclear, hydrogen, water/hydro, storage, bio).
    // EV / Storage / Recycling / Waste / Environment / Policy / Agri aren't
    // generation sources, so they're excluded. This gives a number that
    // intuitively matches what the splash claims to count.
    const ENERGY_SOURCE_SLUGS = new Set([
      'solar', 'wind', 'nuclear', 'hydrogen', 'water', 'storage', 'bio',
    ]);
    const sourcesCount = categories.filter(c => ENERGY_SOURCE_SLUGS.has(c.slug)).length;

    return {
      articles: articles.length,
      sources:  sourcesCount,
      // CO₂ derived from live solar+wind capacity — same source as Impact page.
      co2: (stats && stats.co2 && stats.co2.avoidedToday) || 0,
    };
  } catch {
    return { articles: 0, sources: 0, co2: 0 };
  }
}

// ── LOADING SEQUENCE ─────────────────────────────────
const steps = [
  { pct: 8,   msg: 'Waking up the solar panels…' },
  { pct: 18,  msg: 'Calibrating wind turbines…' },
  { pct: 30,  msg: 'Connecting RSS feeds…' },
  { pct: 44,  msg: 'Sorting recycled bytes…' },
  { pct: 56,  msg: 'Measuring CO₂ impact…' },
  { pct: 68,  msg: 'Charging the feed engine…' },
  { pct: 78,  msg: 'Spinning up the grid…' },
  { pct: 88,  msg: 'Polishing green pixels…' },
  { pct: 95,  msg: 'Almost there…' },
  { pct: 100, msg: 'Ready to renew.' },
];

let stepIdx = 0;
const fill    = document.getElementById('loader-fill');
const txtEl   = document.getElementById('loader-text');
const pctEl   = document.getElementById('loader-pct');

function runLoader() {
  if (stepIdx >= steps.length) return;
  const s = steps[stepIdx++];
  fill.style.width   = s.pct + '%';
  txtEl.textContent  = s.msg;
  pctEl.textContent  = s.pct + '%';

  if (s.pct === 100) {
    // Sequence at 100%:
    //   1. Fetch real stats (typically 200-600ms)
    //   2. Animate counters from 0 to actual values (~1.6s longest)
    //   3. Hold for 1.5s so user can read the numbers
    //   4. Reveal the "ENTER" button overlay
    //
    // Previously the ENTER overlay was fired on a fixed 1.8s timer regardless
    // of fetch latency or animation duration, so the user often saw 0/0/0
    // until the moment the overlay covered everything. Now we chain the
    // operations so each step waits for the previous to finish.
    (async () => {
      // Brief pause before fetching so the loader's "100%" can register visually
      await new Promise(r => setTimeout(r, 250));

      const stats = await fetchSplashStats();

      // Kick off all three animations simultaneously
      const longestAnim = 1600;
      animCount(document.getElementById('stat1'), stats.articles, '',  1200);
      animCount(document.getElementById('stat2'), stats.sources,  '',  800);
      animCount(document.getElementById('stat3'), stats.co2,      '+', longestAnim);

      // Wait for the longest animation to finish, plus a 1.5s read pause
      await new Promise(r => setTimeout(r, longestAnim + 1500));

      showDone();
    })();
  } else {
    const delay = 200 + Math.random() * 400;
    setTimeout(runLoader, delay);
  }
}

setTimeout(runLoader, 1600);

// ── SHOW DONE ────────────────────────────────────────
function showDone() {
  const overlay = document.getElementById('done-overlay');
  overlay.style.pointerEvents = 'auto';
  overlay.style.opacity = '1';
}

// ── ENTER APP ────────────────────────────────────────
function enterApp() {
  const flash = document.getElementById('flash-out');
  flash.style.pointerEvents = 'auto';

  flash.style.opacity = '1';
  setTimeout(() => {
    flash.style.opacity = '0';
    setTimeout(() => {
      // If already logged in, go straight to feed; otherwise login
      const loggedIn = sessionStorage.getItem('rw_logged_in');
      window.location.href = loggedIn ? 'feed.html' : 'login.html';
    }, 200);
  }, 120);
}

// ── MOUSE PARALLAX ON RINGS ──────────────────────────
document.addEventListener('mousemove', e => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const dx = (e.clientX - cx) / cx;
  const dy = (e.clientY - cy) / cy;
  document.querySelector('.rings').style.transform =
    `translate(calc(-50% + ${dx * 12}px), calc(-50% + ${dy * 12}px))`;
  document.querySelector('.glow-center').style.transform =
    `translate(calc(-50% + ${dx * 20}px), calc(-50% + ${dy * 20}px))`;
});

// ── KEYBOARD SHORTCUT ─────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const overlay = document.getElementById('done-overlay');
    if (parseFloat(overlay.style.opacity) > 0) enterApp();
  }
});
</script>
<script>
// Register the service worker for offline support + installability.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').then(function (reg) {
      // When a new SW is found, activate it as soon as it's ready so users
      // aren't stuck on a stale shell after we ship an update.
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch(function () { /* SW registration failed — app still works online */ });
  });
}
</script>
