# Renewonomics — Netlify configuration
# If your HTML files are in a subfolder, change "publish" below to match.
# Examples:
#   publish = "."          → HTML files are at repo root
#   publish = "outputs"    → HTML files are in /outputs folder
#   publish = "site"       → HTML files are in /site folder

[build]
  publish = "."
  functions = "netlify/functions"

# Scheduled function — runs every 30 minutes, 24/7
[functions."fetch-feeds"]
  schedule = "*/30 * * * *"

# Scheduled function — runs once daily at midnight UTC to refresh energy stats
[functions."fetch-stats"]
  schedule = "0 0 * * *"

# CORS headers for the API function
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, DELETE, PATCH, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, x-rw-admin-key"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain"

# Service worker must NOT be cached, or users get stuck on an old SW that
# never picks up new versions. Scope header lets it control the whole site.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest served with the correct MIME type; short cache so branding edits show up.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# PWA icons can be cached for a long time (they're versioned by the SW cache key).
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Root redirect
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/feed"
  to = "/feed.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/champions"
  to = "/champions.html"
  status = 200

[[redirects]]
  from = "/impact"
  to = "/impact.html"
  status = 200

# Per-post Impact share preview — bot-detect & SSR OG tags on /impact/<slug>.
# Must be before the catch-all so /impact/some-slug doesn't get rewritten to
# /index.html. The function itself decides whether to redirect humans to the
# static page or serve crawlers a minimal SSR'd HTML head with OG meta tags.
[[redirects]]
  from = "/impact/*"
  to   = "/.netlify/functions/impact-post/:splat"
  status = 200

# Dynamic sitemap — regenerated on every request from live Impact posts (see
# sitemap.mjs) instead of a static file, so newly published posts appear
# automatically. There must be no static /sitemap.xml file in the publish
# root, or Netlify would serve that instead of ever reaching this redirect
# (static files take priority over redirects).
[[redirects]]
  from = "/sitemap.xml"
  to   = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

# Catch-all fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
